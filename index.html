<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<title>Evan Saves Eleanor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <span>Level: <b id="hud-level">1</b></span>
      <span>Lives: <b id="hud-lives">3</b></span>
      <span>Coins: <b id="hud-coins">0</b></span>
      <span>Form: <b id="hud-form">Evan</b></span>
      <button id="mute-btn" type="button">&#x1F50A;</button>
      <button id="fullscreen-btn" type="button" title="Fullscreen">&#x26F6;</button>
    </div>
    <canvas id="game" width="800" height="500"></canvas>
    <div id="touch-controls">
      <div id="touch-left"  class="tbtn">&larr;</div>
      <div id="touch-right" class="tbtn">&rarr;</div>
      <div id="touch-down"  class="tbtn">&darr;</div>
      <div id="touch-jump"  class="tbtn">&uarr;</div>
      <div id="touch-a"     class="tbtn">A</div>
      <div id="touch-b"     class="tbtn">B</div>
    </div>
    <div id="instructions">
      Move <b>&larr; &rarr;</b> or <b>A D</b> &nbsp;&middot;&nbsp;
      Jump <b>Space</b> or <b>&uarr;</b> &nbsp;&middot;&nbsp;
      Enter tube <b>&darr;</b> &nbsp;&middot;&nbsp;
      Vine: <b>&uarr; &darr;</b> climb, <b>Space</b> jump off
      <br>
      <span style="opacity:0.85">Octopus only: <b>Z</b> spray, hold <b>X</b> to camouflage</span>
    </div>
  </div>
  <script src="audio.js"></script>
  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
